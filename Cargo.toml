[package]
name = "code-workspace"
version = "0.1.4"
edition = "2024"
description = "Workspace root discovery, package detection, and path normalization for multi-ecosystem repositories"
license = "MIT"
readme = "README.md"
repository = "https://github.com/casualjim/rs-code-workspace"
homepage = "https://github.com/casualjim/rs-code-workspace"
authors = ["Ivan Porto Carrero <ivan@flanders.co.nz>"]
keywords = ["workspace", "monorepo", "discovery", "paths"]
categories = ["development-tools", "filesystem"]

[package.metadata.release]
sign-commit = false
sign-tag = false
publish = false
allow-branch = ["main"]
pre-release-commit-message = "chore: Release {{crate_name}} version {{version}}"

[dependencies]
dotnet-lens = "0.1.1"
relative-path = "2.0.1"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml_edit = { version = "0.22", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1"
